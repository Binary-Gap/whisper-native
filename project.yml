name: WhisperNative

options:
  bundleIdPrefix: io.binarygap.whisper-native
  deploymentTarget:
    macOS: "26.0"
  projectFormat: xcode26_0
  usesTabs: false
  xcodeVersion: "26.0"

settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: true
    DEAD_CODE_STRIPPING: true
    SWIFT_VERSION: "6.0"
  configs:
    debug:
      # Ad-hoc ("-") by default so a fresh clone builds without an Apple
      # Development cert; a maintainer overrides DEBUG_SIGN_IDENTITY (and
      # APPLE_TEAM_ID) in gitignored mise.local.toml. See mise.toml.
      CODE_SIGN_IDENTITY: ${DEBUG_SIGN_IDENTITY}
    release:
      CODE_SIGN_IDENTITY: "Developer ID Application"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.4
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2
  MusicPause:
    path: Packages/MusicPause

targets:
  WhisperNative:
    type: application
    platform: macOS
    info:
      path: Sources/WhisperNative/App/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSMicrophoneUsageDescription: "WhisperNative needs microphone access to record audio for transcription."
        NSAppleEventsUsageDescription: "WhisperNative pauses Apple Music while you dictate and resumes it afterwards."
        NSPrincipalClass: NSApplication
    sources:
      - path: Sources/WhisperNative
      - path: Resources/Assets.xcassets
      - path: Resources/iterm
        type: folder
        buildPhase: resources
      # whisper-server + its whisper.cpp/ggml dylibs, staged by
      # `mise run whisper:build` (scripts/stage-whisper-server.sh) with
      # bundle-relative rpaths. Xcode copies and signs them, then seals the app
      # over the result, so the signature stays valid across incremental builds.
      - path: external/whisper.cpp/build/bundle/whisper-server
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: external/whisper.cpp/build/bundle/Frameworks
        buildPhase:
          copyFiles:
            destination: frameworks
        attributes: [CodeSignOnCopy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binarygap.whisper-native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/WhisperNative.entitlements
        APP_DISPLAY_NAME: WhisperNative
      configs:
        # Debug is a separate dev app so it runs next to the installed Release
        # copy: own TCC grants, UserDefaults (settings + hotkeys) and menu bar
        # item. Constants.isDevBuild splits the daemon, port, data and logs.
        debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.binarygap.whisper-native.dev
          APP_DISPLAY_NAME: WhisperNative Dev
    scheme: {}
    dependencies:
      - target: WhisperNativeCore
      - package: KeyboardShortcuts
      - package: MusicPause

  WhisperNativeCore:
    type: framework
    platform: macOS
    info:
      path: Sources/WhisperNativeCore/Shared/Info.plist
      properties:
        CFBundleIdentifier: io.binarygap.whisper-native.core
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
    sources:
      - path: Sources/WhisperNativeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.binarygap.whisper-native.core
        GENERATE_INFOPLIST_FILE: NO
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: WhisperNativeCore
    scheme: {}
    dependencies:
      - package: FluidAudio
      - package: Yams

  WhisperNativeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WhisperNativeCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    scheme:
      testTargets:
        - WhisperNativeCoreTests
      gatherCoverageData: false
    dependencies:
      - target: WhisperNativeCore
